<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contacto">
    <header class="site-header">
        <nav class="nav container" aria-label="Navegacion principal">
            <a class="brand" href="index.html" data-brand></a>
            <div class="nav-links">
                <a href="catalogo.html">Catalogo</a>
                <a href="contacto.html" aria-current="page">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="page-main container">
        <section class="contact-layout">
            <div>
                <p class="eyebrow">Contacto</p>
                <h1>Hablemos de tu proyecto</h1>
                <p>Contanos qué necesitas, cuál es tu objetivo y cómo querés que se vea tu proyecto digital. Enviamos la consulta por WhatsApp para que coordines directamente con nosotros.</p>
            </div>

            <div>
                <div class="contact-mode-switch" role="radiogroup" aria-label="Tipo de consulta">
                    <label class="mode-option">
                        <input type="radio" name="modo-contacto" value="general" data-contact-mode checked>
                        <span>Consulta general</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="modo-contacto" value="encargo" data-contact-mode>
                        <span>Proyecto a medida</span>
                    </label>
                </div>

                <form class="contact-form" data-contact-form-general>
                    <label>
                        Nombre
                        <input type="text" name="nombre" autocomplete="name" required>
                    </label>
                    <label>
                        Mensaje
                        <textarea name="mensaje" rows="7" required placeholder="Ej: Quiero una web para mi negocio y necesito asesoramiento inicial."></textarea>
                    </label>
                    <button class="button button-primary" type="submit">Enviar consulta</button>
                </form>

                <form class="contact-form" data-contact-form-encargo hidden>
                    <label>
                        Nombre
                        <input type="text" name="nombre" autocomplete="name" required>
                    </label>

                    <label>
                        Tipo de proyecto
                        <select name="tipoProyecto" required>
                            <option value="" disabled selected>Elegi una opcion</option>
                            <option value="Landing Page">Landing Page</option>
                            <option value="Sitio web institucional">Sitio web institucional</option>
                            <option value="Tienda online">Tienda online</option>
                            <option value="Branding">Branding</option>
                            <option value="Diseño UX/UI">Diseño UX/UI</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </label>

                    <label>
                        Objetivo del proyecto
                        <textarea name="objetivo" rows="4" placeholder="Contanos cuál es el problema o la necesidad que querés resolver." required></textarea>
                    </label>

                    <label>
                        Plazo estimado
                        <input type="text" name="plazo" placeholder="Ej: 3 semanas o antes de fin de mes" required>
                    </label>

                    <label>
                        Presupuesto estimado
                        <input type="text" name="presupuesto" placeholder="Ej: consultar, entre $100.000 y $200.000" required>
                    </label>

                    <label>
                        Comentarios adicionales
                        <textarea name="descripcion" rows="4" placeholder="Compartí referencias, tono deseado, colores o cualquier detalle importante."></textarea>
                    </label>

                    <button class="button button-primary" type="submit">Enviar proyecto</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p><span data-brand></span>. Servicios de software y diseño.</p>
            <a href="catalogo.html">Ver catalogo</a>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
